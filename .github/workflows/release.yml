name: Release

# Releases cut through the GitHub API (gh release create) fire `release` but
# not `push: tags`, so the tag-push trigger would never run.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v0.3.0
        required: true

permissions:
  contents: write

jobs:
  bundle:
    # Apps linked against an SDK older than the running macOS get that release's
    # compatibility window chrome (smaller corners, old traffic lights).
    runs-on: macos-26
    steps:
      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $tag is not v<major>.<minor>.<patch> — the version is read from it by dropping the leading v. Retag the release and nothing else needs changing; nothing was built and the cask still points at the last good release."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Check manifests match the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          wails=$(node -p "require('./desktop/wails.json').info.productVersion")
          pkg=$(node -p "require('./desktop/frontend/package.json').version")
          fail=0
          for pair in "desktop/wails.json:$wails" "desktop/frontend/package.json:$pkg"; do
            if [ "${pair#*:}" != "$VERSION" ]; then
              echo "::error::${pair%%:*} is ${pair#*:}, tag says $VERSION"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || { echo "Run scripts/set-version.sh $VERSION and retag."; exit 1; }

      - run: go test ./...

      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build Tandem.app with td inside
        run: scripts/build-app.sh "${{ steps.tag.outputs.version }}"

      - name: Check the app links against the macOS 26 SDK
        run: |
          sdk=$(otool -arch arm64 -l desktop/build/bin/Tandem.app/Contents/MacOS/Tandem | awk '/LC_BUILD_VERSION/{f=1} f&&/ sdk /{print $2; exit}')
          echo "Linked against SDK $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::Tandem.app links against SDK $sdk; macOS 26 would show it with legacy window chrome."
            exit 1
          fi

      - name: Package
        id: pkg
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir dist
          for p in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/jonezzyboy/tandem/internal/cli.Version=$VERSION" -o dist/td ./cmd/td
            tar -czf "dist/td_v${VERSION}_${p%/*}_${p#*/}.tar.gz" -C dist td
          done
          rm dist/td
          zip="dist/Tandem_v${VERSION}_macos_universal.zip"
          ditto -c -k --keepParent desktop/build/bin/Tandem.app "$zip"
          (cd dist && shasum -a 256 *.tar.gz *.zip > checksums.txt)
          echo "sha256=$(shasum -a 256 "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

      - name: Update the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
          SHA256: ${{ steps.pkg.outputs.sha256 }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN secret is unset — the cask would stay on the old version."
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/Jonezzyboy/homebrew-tandem.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$SHA256/g" \
            packaging/cask.rb.tmpl > tap/Casks/tandem-repos.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tandem-repos.rb
          if git diff --cached --quiet; then
            echo "Cask already at $VERSION."
          else
            git commit -m "tandem-repos $VERSION"
            git push
          fi
